name: Pages aktivieren

on:
  push:
    branches: [main]
    paths: ['.github/workflows/pages-aktivieren.yml']
  workflow_dispatch:

permissions:
  pages: write
  contents: read

jobs:
  enable:
    runs-on: ubuntu-24.04
    steps:
      - name: GitHub Pages einschalten (Branch gh-pages)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/pages 2>/dev/null && { echo "Pages ist schon an"; exit 0; }
          gh api -X POST repos/${{ github.repository }}/pages -f "source[branch]=gh-pages" -f "source[path]=/" -f build_type=legacy
          gh api repos/${{ github.repository }}/pages
