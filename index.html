<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Magic the Foxering</title>
<meta name="theme-color" content="#0F0D14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Foxering">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://cards.scryfall.io">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <main id="view"></main>
  <nav id="nav">
    <button data-act="tab" data-tab="collection" class="nav-btn"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="10" rx="1.5"/><rect x="14" y="4" width="7" height="10" rx="1.5"/><path d="M3 18h18M3 21h18"/></svg><span>Sammlung</span></button>
    <button data-act="tab" data-tab="sets" class="nav-btn"><svg viewBox="0 0 24 24"><path d="M12 3l8 4-8 4-8-4 8-4z"/><path d="M4 12l8 4 8-4"/><path d="M4 17l8 4 8-4"/></svg><span>Sets</span></button>
    <button data-act="tab" data-tab="bundles" class="nav-btn"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="13" rx="1.5"/><path d="M12 8v13M3 12h18M12 8c-2-4-6-4-6-1.5S10 8 12 8zm0 0c2-4 6-4 6-1.5S14 8 12 8z"/></svg><span>Bundles</span></button>
    <button data-act="scan-open" class="nav-scan" aria-label="Scannen"><svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><rect x="8" y="7" width="8" height="10" rx="1"/></svg></button>
    <button data-act="tab" data-tab="coop" class="nav-btn"><svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="3"/><circle cx="16.5" cy="9" r="2.5"/><path d="M2.5 19c.6-3.3 2.9-5 5.5-5s4.9 1.7 5.5 5M13.5 14.6c.9-.4 1.9-.6 3-.6 2.3 0 4.2 1.5 4.7 4.5"/></svg><span>Koop</span></button>
    <button data-act="tab" data-tab="decks" class="nav-btn"><svg viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="16" rx="2"/><path d="M3 7v12a2 2 0 0 0 2 2h10"/></svg><span>Decks</span></button>
    <button data-act="tab" data-tab="more" class="nav-btn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg><span>Mehr</span></button>
  </nav>
</div>

<div id="scan" class="scan" hidden>
  <video id="vid" playsinline muted autoplay></video>
  <div class="guide"><div class="frame" id="frame"></div></div>
  <div class="flash" id="flash"></div>
  <div class="scan-top">
    <button class="round" data-act="scan-close" aria-label="Schließen">✕</button>
    <div id="scan-status" class="pill">Kamera startet…</div>
    <button class="round" data-act="scan-torch" id="btn-torch" aria-label="Licht">💡</button>
  </div>
  <div class="scan-opts">
    <button class="chip dark" data-act="scan-lang" id="opt-lang"></button>
    <button class="chip dark" data-act="scan-foil" id="opt-foil"></button>
    <button class="chip dark" data-act="scan-rot" id="opt-rot"></button>
    <button class="chip dark" data-act="scan-size" id="opt-size"></button>
    <button class="chip dark" data-act="scan-pause" id="opt-pause"></button>
  </div>
  <div id="scan-last" class="scan-last"></div>
  <div class="scan-bottom">
    <div class="scan-sum" id="scan-sum"></div>
    <button class="btn small" id="btn-photo" data-act="scan-photo" hidden>📸 Foto</button>
    <button class="btn small" data-act="scan-list">Liste</button>
    <button class="btn small ghost" data-act="scan-manual">+ Manuell</button>
  </div>
</div>

<div id="sheet-wrap" class="sheet-wrap"><div class="sheet-bg" data-act="sheet-close"></div><div id="sheet" class="sheet"></div></div>
<div id="toast" class="toast"></div>
<input type="file" id="file-in" hidden>
<canvas id="cv" hidden></canvas>
<canvas id="cv-sig" width="24" height="24" hidden></canvas>

<script src="data.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
<script src="bundles.js"></script>
<script src="coop.js"></script>
<script src="assistant.js"></script>
</body>
</html>
